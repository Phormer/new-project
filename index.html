<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taskflow — To-Do App</title>
  <meta name="description" content="A clean, fast, offline-ready To-Do app with priorities, due dates, tags, search, and dark mode." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232563eb'/><path d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <div>
          <h1>Taskflow</h1>
          <p class="subtitle" id="today-label">Stay focused and ship what matters</p>
        </div>
      </div>

      <div class="header-actions">
        <button type="button" class="icon-btn" id="export-btn" title="Export tasks as JSON" aria-label="Export tasks as JSON">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </button>
        <button type="button" class="icon-btn" id="import-btn" title="Import tasks from JSON" aria-label="Import tasks from JSON">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
        </button>
        <input type="file" id="import-file" accept="application/json,.json" hidden />
        <button type="button" class="icon-btn" id="theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">
          <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <main>
      <section class="stats-card" aria-label="Task progress">
        <div class="stats-row">
          <div class="stat-pill">
            <span class="stat-value" id="stat-active">0</span>
            <span class="stat-label">Remaining</span>
          </div>
          <div class="stat-pill">
            <span class="stat-value" id="stat-completed">0</span>
            <span class="stat-label">Completed</span>
          </div>
          <div class="stat-pill" id="stat-overdue-pill">
            <span class="stat-value" id="stat-overdue">0</span>
            <span class="stat-label">Overdue</span>
          </div>
          <div class="stat-pill stat-progress-label">
            <span class="stat-value" id="stat-percent">0%</span>
            <span class="stat-label">Done</span>
          </div>
        </div>
        <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-bar-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </section>

      <section class="composer-card" aria-label="Add a new task">
        <form id="task-form" autocomplete="off">
          <div class="composer-main">
            <label for="task-title" class="sr-only">Task title</label>
            <input
              type="text"
              id="task-title"
              name="title"
              placeholder="What needs to be done?"
              maxlength="200"
              required
            />
            <button type="submit" class="primary-btn">Add Task</button>
          </div>

          <div class="composer-meta">
            <label class="meta-field">
              <span>Priority</span>
              <select id="task-priority" name="priority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </label>

            <label class="meta-field">
              <span>Due date</span>
              <input type="date" id="task-due-date" name="dueDate" />
            </label>

            <label class="meta-field">
              <span>Tag</span>
              <input type="text" id="task-category" name="category" placeholder="e.g. Work, Personal" maxlength="32" />
            </label>
          </div>
        </form>
      </section>

      <section class="toolbar" aria-label="Filter and sort tasks">
        <div class="filter-tabs" role="tablist" aria-label="Filter by status">
          <button type="button" class="filter-tab is-active" data-filter="all" role="tab" aria-selected="true">All</button>
          <button type="button" class="filter-tab" data-filter="active" role="tab" aria-selected="false">Active</button>
          <button type="button" class="filter-tab" data-filter="completed" role="tab" aria-selected="false">Completed</button>
        </div>

        <div class="toolbar-controls">
          <div class="search-box">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <label for="search-input" class="sr-only">Search tasks</label>
            <input type="search" id="search-input" placeholder="Search tasks or tags..." />
          </div>

          <label class="sr-only" for="priority-filter">Filter by priority</label>
          <select id="priority-filter" class="toolbar-select" title="Filter by priority">
            <option value="all">All priorities</option>
            <option value="high">High priority</option>
            <option value="medium">Medium priority</option>
            <option value="low">Low priority</option>
          </select>

          <label class="sr-only" for="sort-select">Sort tasks</label>
          <select id="sort-select" class="toolbar-select" title="Sort tasks">
            <option value="manual">Manual order</option>
            <option value="newest">Newest first</option>
            <option value="priority">Priority</option>
            <option value="dueDate">Due date</option>
          </select>
        </div>
      </section>

      <section class="list-card" aria-label="Task list">
        <ul id="task-list" class="task-list" aria-live="polite"></ul>

        <div id="empty-state" class="empty-state" hidden>
          <div class="empty-icon" aria-hidden="true">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="16" rx="3"></rect>
              <path d="M9 12l2 2 4-4"></path>
            </svg>
          </div>
          <h2 id="empty-title">No tasks yet</h2>
          <p id="empty-message">Add your first task above to get started.</p>
        </div>

        <footer class="list-footer" id="list-footer">
          <div class="footer-left">
            <button type="button" class="text-btn" id="toggle-all-btn">Complete all</button>
            <span class="hint" id="drag-hint">Drag tasks to reorder</span>
          </div>
          <button type="button" class="text-btn danger" id="clear-completed-btn">Clear completed</button>
        </footer>
      </section>
    </main>

    <footer class="app-footer">
      <span>Saved locally in your browser</span>
      <span>Tip: Double-click a task to edit &middot; Press <kbd>/</kbd> to search</span>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span id="toast-message"></span>
    <button type="button" class="toast-action" id="toast-action" hidden></button>
  </div>

  <script src="src/todo-store.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
